# kriya governance policy — generated by kriya Console.
# The host (kriya / kriya-mcp) enforces this on every agent action: rules are
# evaluated top-to-bottom, the first match wins, and no match = deny.
rules:
  - action: "create_*"
    allow: true
  - action: "edit_*"
    allow: true
  - action: "delete_*"
    allow: true
    require_approval: true
  - action: "*"
    allow: false
budget:
  max_actions_per_minute: 60
gates:
  classes:
    deploy:
      tier: "approve"
      demoted_tier: "receipt"
    destructive-git:
      tier: "receipt"
      demoted_tier: "receipt"
      protected_refs:
        - "main"
        - "release/*"
    publish:
      tier: "approve"
      demoted_tier: "receipt"
    prod-db:
      tier: "approve"
      demoted_tier: "allow"
    infra:
      tier: "approve"
      demoted_tier: "receipt"
    send:
      tier: "receipt"
      demoted_tier: "receipt"
      internal_domains: &ref_1 []
    self-mod:
      tier: "deny"
      demoted_tier: "deny"
    payment:
      tier: "approve"
      demoted_tier: "approve"
  rules:
    - class: "destructive-git"
      rule_id: "git-force-push--protected"
      tier: "deny"
      command_any:
        - "\\bgit\\s+push\\b[^|;&]*(\\s--force(-with-lease)?\\b|\\s-f\\b)"
      command_all:
        - "(?:\\bmain\\b|\\brelease/)"
      command_not: &ref_0
        - "\\bgit\\s+push\\b[^|;&]*(--tags\\b|\\srefs/tags/)"
    - class: "destructive-git"
      rule_id: "git-force-push"
      tier: "receipt"
      command_any:
        - "\\bgit\\s+push\\b[^|;&]*(\\s--force(-with-lease)?\\b|\\s-f\\b)"
      command_not: *ref_0
    - class: "destructive-git"
      rule_id: "git-reset-hard"
      tier: "receipt"
      command_any:
        - "\\bgit\\s+reset\\s+--hard\\b"
    - class: "destructive-git"
      rule_id: "git-branch-delete--protected"
      tier: "deny"
      command_any:
        - "\\bgit\\s+branch\\s+(-D|--delete\\s+--force)\\b"
      command_all:
        - "(?:\\bmain\\b|\\brelease/)"
    - class: "destructive-git"
      rule_id: "git-branch-delete"
      tier: "receipt"
      command_any:
        - "\\bgit\\s+branch\\s+(-D|--delete\\s+--force)\\b"
    - class: "destructive-git"
      rule_id: "git-history-rewrite"
      tier: "receipt"
      command_any:
        - "\\bgit\\s+(filter-branch|filter-repo)\\b"
    - class: "publish"
      rule_id: "npm-publish"
      tier: "approve"
      command_any:
        - "\\b(npm|pnpm|yarn)\\s+publish\\b"
    - class: "publish"
      rule_id: "cargo-publish"
      tier: "approve"
      command_any:
        - "\\bcargo\\s+publish\\b"
    - class: "publish"
      rule_id: "pypi-publish"
      tier: "approve"
      command_any:
        - "\\b(twine\\s+upload|uv\\s+publish|python3?\\s+-m\\s+twine\\s+upload)\\b"
    - class: "publish"
      rule_id: "gem-publish"
      tier: "approve"
      command_any:
        - "\\bgem\\s+push\\b"
    - class: "deploy"
      rule_id: "fly-deploy"
      tier: "approve"
      command_any:
        - "\\b(fly|flyctl)\\s+deploy\\b"
    - class: "deploy"
      rule_id: "vercel-prod"
      tier: "approve"
      command_any:
        - "\\bvercel(\\s+deploy)?\\b[^|;&]*\\s(--prod|--production)\\b"
    - class: "deploy"
      rule_id: "vercel-preview"
      tier: "receipt"
      command_any:
        - "\\bvercel\\s+deploy\\b"
    - class: "deploy"
      rule_id: "netlify-prod"
      tier: "approve"
      command_any:
        - "\\bnetlify\\s+deploy\\b[^|;&]*\\s--prod\\b"
    - class: "deploy"
      rule_id: "netlify-preview"
      tier: "receipt"
      command_any:
        - "\\bnetlify\\s+deploy\\b"
    - class: "deploy"
      rule_id: "railway-up"
      tier: "approve"
      command_any:
        - "\\brailway\\s+(up|deploy)\\b"
    - class: "deploy"
      rule_id: "kubectl-mutate"
      tier: "approve"
      command_any:
        - "\\bkubectl\\s+(apply|rollout|delete|scale|patch)\\b"
    - class: "deploy"
      rule_id: "gcloud-deploy"
      tier: "approve"
      command_any:
        - "\\bgcloud\\s+\\S*\\s*(app|run|functions|compute)\\s+deploy\\b|\\bgcloud\\s+deploy\\b"
    - class: "deploy"
      rule_id: "aws-deploy"
      tier: "approve"
      command_any:
        - "\\baws\\s+(deploy\\b|ecs\\s+update-service\\b|lambda\\s+update-function-code\\b)"
    - class: "infra"
      rule_id: "tf-apply"
      tier: "approve"
      command_any:
        - "\\b(terraform|tofu)\\s+(apply|destroy)\\b"
    - class: "infra"
      rule_id: "pulumi-up"
      tier: "approve"
      command_any:
        - "\\bpulumi\\s+(up|destroy)\\b"
    - class: "infra"
      rule_id: "iam-mutate"
      tier: "approve"
      command_any:
        - "\\b(aws\\s+iam|aws\\s+kms|gcloud\\s+iam|az\\s+role)\\s+\\S*(create|delete|put|attach|detach|update|add|remove)"
    - class: "infra"
      rule_id: "cloud-delete"
      tier: "approve"
      command_any:
        - "\\b(aws\\s+ec2\\s+terminate-instances|aws\\s+s3\\s+rb|aws\\s+rds\\s+delete|gcloud\\s+\\S+\\s+(instances\\s+)?delete|az\\s+\\S+\\s+delete)\\b"
    - class: "prod-db"
      rule_id: "prisma-migrate-deploy"
      tier: "approve"
      command_any:
        - "\\bprisma\\s+migrate\\s+deploy\\b"
    - class: "prod-db"
      rule_id: "supabase-db-push"
      tier: "approve"
      command_any:
        - "\\bsupabase\\s+db\\s+push\\b"
    - class: "prod-db"
      rule_id: "destructive-sql"
      tier: "approve"
      command_any:
        - "(?i)\\b(drop\\s+(table|database|schema)|truncate\\s+table|delete\\s+from)\\b"
      command_all:
        - "\\b(psql|mysql|sqlite3|mongosh)\\b"
      command_not:
        - "(?i)\\b(localhost|127\\.0\\.0\\.1|preview|branch|staging|dev|test)\\b"
    - class: "prod-db"
      rule_id: "destructive-sql-local"
      tier: "allow"
      command_any:
        - "(?i)\\b(drop\\s+(table|database|schema)|truncate\\s+table|delete\\s+from)\\b"
      command_all:
        - "\\b(psql|mysql|sqlite3|mongosh)\\b"
        - "(?i)\\b(localhost|127\\.0\\.0\\.1|preview|branch|staging|dev|test)\\b"
    - class: "prod-db"
      rule_id: "psql-prod"
      tier: "approve"
      command_any:
        - "\\bpsql\\b[^|;&]*"
      command_all:
        - "\\s(-c|-f)\\s"
      command_not:
        - "(?i)\\b(localhost|127\\.0\\.0\\.1|preview|branch|staging|dev|test)\\b"
    - class: "payment"
      rule_id: "stripe-cli"
      tier: "approve"
      command_any:
        - "\\bstripe\\s+(charges|payment_intents|payment_links|invoices|subscriptions)\\s+(create|capture|confirm|pay|update)\\b"
    - class: "deps"
      rule_id: "dep-install"
      tier: "receipt"
      command_any:
        - "\\b(npm\\s+(install|i|add)\\s+[^-\\s]|pnpm\\s+add\\s+|yarn\\s+add\\s+|cargo\\s+add\\s+|pip3?\\s+install\\s+[^-\\s]|uv\\s+(add|pip\\s+install)\\s+|poetry\\s+add\\s+|gem\\s+install\\s+|go\\s+get\\s+|brew\\s+install\\s+)"
    - class: "self-mod"
      rule_id: "self-config-path"
      tier: "deny"
      path_any:
        - "(?i)(^|/)\\.claude/settings[^/]*$|(^|/)\\.claude/hooks(/|$)|(^|/)\\.?mcp\\.json$|(^|/)\\.cursor/mcp\\.json$|(^|/)\\.codex/config[^/]*$|(^|/)\\.kriya/|(^|/)agent-policy\\.ya?ml$|(^|/)settings\\.local\\.json$"
    - class: "payment"
      rule_id: "pay-server"
      tier: "approve"
      tool_any:
        - tool: ".*"
          server: "(?i)\\b(stripe|paypal|x402|square|braintree|razorpay)\\b"
    - class: "payment"
      rule_id: "pay-tool"
      tier: "approve"
      tool_any:
        - tool: "(?i)(^|_|\\b)(pay|payment|charge|checkout|purchase|refund|payout)(s)?(_|\\b)"
    - class: "prod-db"
      rule_id: "db-migration-complete"
      tier: "approve"
      tool_any:
        - tool: "^(complete_database_migration|apply_migration)$"
    - class: "prod-db"
      rule_id: "db-migration-prepare"
      tier: "allow"
      tool_any:
        - tool: "^prepare_database_migration$"
    - class: "deploy"
      rule_id: "mcp-deploy"
      tier: "approve"
      tool_any:
        - tool: "(^|_)deploy(_|$)"
    - class: "send"
      rule_id: "send-tool"
      tier: "receipt"
      tool_any:
        - tool: "(?i)(^|_|\\b)(send|post)_(email|mail|message|dm|sms)\\b|^send_|_send$"
      send:
        internal_domains: *ref_1
        internal_tier: "receipt"
    - class: "send"
      rule_id: "send-server"
      tier: "receipt"
      tool_any:
        - tool: "(?i)send|post|message|mail"
          server: "(?i)\\b(gmail|smtp|slack|outlook|sendgrid|mailgun|postmark|resend|twilio)\\b"
      send:
        internal_domains: *ref_1
        internal_tier: "receipt"
