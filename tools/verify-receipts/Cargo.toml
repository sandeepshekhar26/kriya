[package]
name = "verify-receipts"
version = "0.1.0"
edition = "2021"
description = "Offline verifier for the kriya Ed25519-signed audit log."

[[bin]]
name = "verify-receipts"
path = "src/main.rs"

[features]
# A4 (doc 27 / docs/design/a4-fips-lane.md): opt-in FIPS lane, forwarded to the `kriya` lib crate.
fips-crypto = ["kriya/fips-crypto"]
# A5 (doc 27 / docs/design/a5-pq-dual-sig.md): opt-in PQ lane, forwarded to the `kriya` lib
# crate. Mutually exclusive with `fips-crypto` — see `kriya::crypto`'s deviation note.
pq-crypto = ["kriya/pq-crypto"]

[dependencies]
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
hex        = "0.4"
sha2       = "0.10"
# Depended on ONLY for `kriya::crypto` (the A4/A5 facade) — `default-features = false` keeps this
# offline CLI free of tauri/ureq/rusqlite/etc.; it never links the kriya library's optional
# integrations, just the crypto seam both verify paths now share.
kriya = { path = "../../crates/kriya", default-features = false }

# A5 (design D7): second, independent ML-DSA-87 implementation, TEST-ONLY (never a verify-path
# dependency of this binary — `kriya::crypto::pq_verify`, aws-lc-rs, is the only production PQ
# verifier here too). Default features (`alloc`, `getrandom`, `pkcs8`) pull its own compatible
# `signature`/`rand_core` versions — deliberately NOT pinned separately here to avoid a duplicate
# `signature`-crate version conflict with `aws-lc-rs`'s own (older) `signature` dependency.
[dev-dependencies]
ml-dsa = "0.1"
