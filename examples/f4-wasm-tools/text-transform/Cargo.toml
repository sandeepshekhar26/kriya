[package]
name = "text-transform"
version = "0.1.0"
edition = "2021"
publish = false
description = "F4-wasm (doc 28 §F4) example governed tool #1 — a WASI-p2 text transform, built to run under kriya-run-wasm's Deterministic Execution lane. Not published; a fixture/demo binary."

[[bin]]
name = "text-transform"
path = "src/main.rs"

# Kept dependency-free on purpose: the rail is the product, not the tool — a minimal std-only guest
# is the honest demo of what a WASI-p2 component under this lane looks like.
[profile.release]
opt-level = "s"
