name: ci

on:
  push:
    branches: [main]
  pull_request:

# Cancel in-flight runs on the same ref. Saves CI minutes on rapid pushes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: node (sdk + inspector + apps tsc)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: install workspace
        run: npm install --no-audit --no-fund

      - name: build kriya-core
        run: npm run build --workspace kriya-core

      - name: test kriya-core
        run: npm run test --workspace kriya-core

      - name: build kriya-inspector
        run: npm run build --workspace kriya-inspector

      - name: typecheck note-app
        run: npx tsc --noEmit
        working-directory: apps/note-app

      - name: typecheck task-manager
        run: npx tsc --noEmit
        working-directory: apps/task-manager

  rust:
    name: rust (host crate tests + apps cargo check)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Tauri 2 system deps. Pulled from the Tauri 2 prerequisites page.
      - name: install tauri system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.90.0"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          # Share the cache across both app crate roots. The host crate is a
          # library with no committed Cargo.lock (consumers own resolution); its
          # tests run via the note-app's lockfile, which has the alloc-no-stdlib
          # pin that dodges the brotli/alloc-stdlib trait split.
          workspaces: |
            apps/note-app/src-tauri
            apps/task-manager/src-tauri

      - name: test kriya (via note-app lockfile)
        working-directory: apps/note-app/src-tauri
        run: cargo test -p kriya --locked

      - name: test kriya MCP client + broker + remote HTTP transport
        working-directory: crates/kriya
        run: cargo test --features mcp-http

      - name: cargo check note-app backend
        working-directory: apps/note-app/src-tauri
        run: cargo check --locked

      - name: cargo check task-manager backend
        working-directory: apps/task-manager/src-tauri
        run: cargo check --locked

  fips-crypto:
    name: fips-crypto (A4, doc 27 — opt-in aws-lc-rs fips lane)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Tauri 2 system deps — same block as the `rust` job. `cargo build -p kriya` transitively
      # pulls the Tauri/wry GUI deps (glib-sys/gobject-sys) on Linux, so these system libs are
      # required here too; without them glib-sys/gobject-sys build scripts fail.
      - name: install tauri system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      # aws-lc-fips-sys needs CMake + Go (+ a C/C++ compiler, already present on the runner) at
      # build time — see docs/design/a4-fips-lane.md D4. Off by default everywhere else, so this
      # job is the ONLY place this toolchain is required.
      - name: install FIPS build toolchain (CMake + Go)
        run: |
          sudo apt-get install -y cmake golang-go

      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.90.0"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/kriya

      - name: cargo build -p kriya --features fips-crypto
        working-directory: crates/kriya
        run: cargo build --features fips-crypto

      - name: cargo test -p kriya --features fips-crypto (FIPS parity/interop + full suite)
        working-directory: crates/kriya
        run: cargo test --features fips-crypto

      - name: cargo test -p kriya --features mcp-http,fips-crypto
        working-directory: crates/kriya
        run: cargo test --features mcp-http,fips-crypto

      - name: build + test the offline verify-receipts CLI under fips-crypto
        working-directory: tools/verify-receipts
        run: |
          cargo build --features fips-crypto
          cargo test --features fips-crypto

  pq-crypto:
    name: pq-crypto (A5, doc 27 — opt-in aws-lc-rs unstable ML-DSA-87 lane)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Same Tauri 2 system deps the `rust`/`fips-crypto` jobs need (glib-sys/gobject-sys are
      # transitively pulled by `cargo build -p kriya` on Linux).
      - name: install tauri system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.90.0"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/kriya

      - name: cargo build -p kriya --features pq-crypto
        working-directory: crates/kriya
        run: cargo build --features pq-crypto

      - name: cargo test -p kriya --features pq-crypto (PQ parity/interop + full suite)
        working-directory: crates/kriya
        run: cargo test --features pq-crypto

      # The two cross-implementation ML-DSA-87 parity tests (aws-lc-rs ⇄ RustCrypto `ml-dsa`) were
      # moved out of `crates/kriya` into this standalone sibling crate so `crates/kriya` carries no
      # dev-dependencies (required for `cargo test -p kriya` from the note-app workspace). They run
      # here, in the same pq-crypto job, so the same toolchain/cache covers them and the cross-impl
      # assurance still executes on every push.
      - name: test kriya-pq-parity (cross-impl ML-DSA-87 parity, aws-lc-rs ⇄ RustCrypto)
        working-directory: crates/kriya-pq-parity
        run: cargo test

      - name: cargo test -p kriya --features mcp-http,pq-crypto
        working-directory: crates/kriya
        run: cargo test --features mcp-http,pq-crypto

      - name: build + test the offline verify-receipts CLI under pq-crypto
        working-directory: tools/verify-receipts
        run: |
          cargo build --features pq-crypto
          cargo test --features pq-crypto

      # Design D4/RT2.5 deviation (documented in crypto.rs): pq-crypto and fips-crypto are
      # MUTUALLY EXCLUSIVE at the aws-lc-rs dependency level (its `unstable` module is compiled
      # out whenever `fips` is active). This asserts the guard fires — the compose cell the
      # original design called for is impossible, so this replaces it with a negative-space test:
      # the combined build MUST fail, with the documented compile_error! message.
      - name: assert pq-crypto + fips-crypto together is a build ERROR (documented mutual exclusion)
        working-directory: crates/kriya
        run: |
          if cargo build --features "pq-crypto,fips-crypto" 2>build.log; then
            echo "::error::pq-crypto + fips-crypto built successfully — expected a compile_error! (see crypto.rs's deviation note)"
            exit 1
          fi
          grep -q "cannot be enabled together" build.log || (cat build.log && exit 1)

  scaffolder-smoke:
    name: scaffolder (generate + tsc the output)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [node]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: install workspace
        run: npm install --no-audit --no-fund

      - name: build core (needed by scaffolded app's tsc)
        run: npm run build --workspace kriya-core

      - name: build inspector
        run: npm run build --workspace kriya-inspector

      - name: scaffold a sample app
        run: |
          cd "$RUNNER_TEMP"
          node "$GITHUB_WORKSPACE/packages/create-kriya-app/bin/index.mjs" ci-smoke

      - name: verify scaffolded files
        run: |
          cd "$RUNNER_TEMP/ci-smoke"
          test -f README.md
          test -f package.json
          test -f src-tauri/Cargo.toml
          test -f src/actions.ts
          # No unsubstituted placeholders. Match the exact tokens the scaffolder
          # replaces — `format!` macros legitimately contain `{{` as a literal
          # brace escape, so the test has to be specific.
          if grep -rE '\{\{(NAME|NAME_SNAKE|TITLE|IDENTIFIER)\}\}' .; then
            echo "ERROR: unsubstituted scaffolder placeholders found above" >&2
            exit 1
          fi

      - name: typecheck the scaffolded app against the in-repo workspace
        run: |
          # Move scaffolded app under apps/ so workspace resolves the kriya-* packages
          mv "$RUNNER_TEMP/ci-smoke" "$GITHUB_WORKSPACE/apps/ci-smoke"
          npm install --no-audit --no-fund
          cd "$GITHUB_WORKSPACE/apps/ci-smoke"
          npx tsc --noEmit
